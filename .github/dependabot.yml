# Weekly grouped dependency PRs. Minor+patch are batched into a single PR
# so you mostly merge once a week. Majors get individual PRs.
#
# Single npm entry at root — workspaces (frontend/, backend/, circuits/,
# tests/e2e/) share the root lockfile so one scan covers them all.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
      include: scope
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
