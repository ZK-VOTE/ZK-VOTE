name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  contracts:
    name: Rust Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build WASM
        run: |
          rustup target add wasm32v1-none
          cargo build --target wasm32v1-none --release
      - name: Run tests
        run: cargo test --workspace
      - name: Doc check
        run: cargo doc --workspace --no-deps
      - name: Security audit
        run: |
          cargo install cargo-audit || true
          cargo audit || true

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Type check
        run: npm run type-check
      - name: Lint (includes JSDoc validation)
        run: npm run lint
      - name: Format check
        run: npx prettier --check "src/**/*.{ts,tsx}"
      - name: Tests with coverage
        run: npx vitest run --coverage --reporter=default
      - name: Security audit
        run: npm audit --audit-level=high || true
      - name: Build verification
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (includes JSDoc validation + type check)
        run: npm run lint
      - name: Format check
        run: npx prettier --check "src/**/*.ts"
      - name: Run tests
        run: npm test
        env:
          RELAYER_TEST_MODE: 'true'
          SOROBAN_RPC_URL: 'https://soroban-testnet.stellar.org'
          NETWORK_PASSPHRASE: 'Test SDF Network ; September 2015'
          RELAYER_SECRET_KEY: 'SCZANGBA5AKIA7VTJQXBDKPQOBFZD3NWKNR3CQULPSFMJUADSHWFUCS'
          RELAYER_AUTH_TOKEN: 'ci-test-token-placeholder-32-chars-min'
          VOTING_CONTRACT_ID: 'CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC'
          TREE_CONTRACT_ID: 'CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC'
          COMMENTS_CONTRACT_ID: 'CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC'
      - name: Security audit
        run: npm audit --audit-level=high || true
      - name: Build verification
        run: npm run build

  circuits:
    name: Circuits
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: circuits
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: circuits/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
