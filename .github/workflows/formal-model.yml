name: Formal Model Check

on:
  pull_request:
  push:
    branches: [master, main]
    paths:
      - 'formal-model/**'
      - '.github/workflows/formal-model.yml'

jobs:
  tlc-check:
    name: TLC Model Checker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: formal-model
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Download TLA+ tools
        run: |
          curl -sL -o tla2tools.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
      
      - name: Verify TLA+ files exist
        run: |
          if [ ! -f "ZKVote.tla" ]; then
            echo "Error: ZKVote.tla not found"
            exit 1
          fi
          if [ ! -f "ZKVote.cfg" ]; then
            echo "Error: ZKVote.cfg not found"
            exit 1
          fi
      
      - name: Run TLC model checker (PR smoke check)
        run: |
          java -cp tla2tools.jar tlc2.TLC \
            ZKVote.tla \
            -config ZKVote.cfg \
            -depth 20 \
            -workers auto \
            -cleanup \
            || echo "TLC check completed with warnings"
      
      - name: Display TLC output summary
        if: always()
        run: |
          echo "TLC Model Check Summary:"
          echo "- Configuration: ZKVote.cfg"
          echo "- Depth: 20"
          echo "- Status: Check logs above for results"
  
  apalache-typecheck:
    name: Apalache Type Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: formal-model
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Apalache (via Docker)
        run: |
          docker pull ghcr.io/apalache-mc/apalache:latest
      
      - name: Run Apalache type check
        run: |
          docker run --rm -v "$(pwd):/data" \
            ghcr.io/apalache-mc/apalache:latest \
            typecheck /data/ZKVote.tla \
            || echo "Apalache typecheck completed with warnings"
      
      - name: Display Apalache summary
        if: always()
        run: |
          echo "Apalache Type Check Summary:"
          echo "- Model: ZKVote.tla"
          echo "- Status: Check logs above for results"
