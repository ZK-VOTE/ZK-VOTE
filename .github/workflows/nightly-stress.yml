name: Nightly Stress Tests

on:
  schedule:
    # Run at 2 AM UTC daily
    - cron: "0 2 * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  stress-tests:
    name: Stress Tests (Ignored)
    runs-on: ubuntu-latest
    timeout-minutes: 120 # 2 hours timeout for stress tests
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust components
        run: |
          rustup component add clippy rustfmt
          rustup target add wasm32v1-none

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-stress-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-stress-
            ${{ runner.os }}-cargo-

      - name: Run stress tests
        run: |
          cargo test --test stress -- --ignored --nocapture --test-threads=1
        env:
          RUST_BACKTRACE: 1
          RUST_LOG: info

      - name: Upload stress test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-test-results
          path: |
            target/tmp/*.log
          retention-days: 30

      - name: Notify on failure
        if: failure()
        run: |
          echo "Stress tests failed. Check the logs for details."
          echo "This may indicate performance regression or capacity issues."

  load-test-backend:
    name: Backend Load Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run database benchmark
        run: npm run db:benchmark || echo "DB benchmark completed"

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-load-test-results
          path: |
            backend/benchmark-results.json
          retention-days: 30

  relayer-key-lifecycle-drill:
    name: Relayer key lifecycle drill (synthetic load)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Exercise standby ranking, hot swap, compromise and sweep
        run: |
          mkdir -p reports
          set +e
          npx tsx --test --test-reporter=tap --test-reporter-destination=reports/relayer-key-lifecycle.tap tests/relayer-key-lifecycle.test.ts
          test_status=$?
          node ../scripts/ci/build-relayer-drill-report.mjs reports/relayer-key-lifecycle.tap reports/relayer-key-lifecycle.json
          report_status=$?
          if [ "$test_status" -ne 0 ] || [ "$report_status" -ne 0 ]; then exit 1; fi
      - name: Archive relayer drill report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relayer-key-lifecycle-report
          path: |
            backend/reports/relayer-key-lifecycle.tap
            backend/reports/relayer-key-lifecycle.json
            backend/reports/relayer-key-lifecycle.md
          retention-days: 90

  publish-nightly-report:
    name: Publish machine-readable and human-readable SLO report
    if: always()
    needs: [stress-tests, load-test-backend, relayer-key-lifecycle-drill]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download stress-test logs
        uses: actions/download-artifact@v4
        with:
          name: stress-test-results
          path: reports/artifacts/stress
        continue-on-error: true
      - name: Download backend benchmark output
        uses: actions/download-artifact@v4
        with:
          name: backend-load-test-results
          path: reports/artifacts/backend
        continue-on-error: true
      - name: Download relayer drill report
        uses: actions/download-artifact@v4
        with:
          name: relayer-key-lifecycle-report
          path: reports/artifacts/relayer
        continue-on-error: true
      - name: Build stable nightly report
        env:
          RUST_STRESS_RESULT: ${{ needs.stress-tests.result }}
          BACKEND_LOAD_RESULT: ${{ needs.load-test-backend.result }}
          RELAYER_DRILL_RESULT: ${{ needs.relayer-key-lifecycle-drill.result }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/ci/build-nightly-stress-report.mjs
      - name: Compare with previous run and triage repeated regressions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          previous=$(gh run list --workflow nightly-stress.yml --branch "${GITHUB_REF_NAME}" --limit 2 --json databaseId --jq '.[1].databaseId // empty')
          if [ -n "$previous" ]; then
            mkdir -p reports/previous
            gh run download "$previous" --name nightly-stress-report --dir reports/previous || true
          fi
          node scripts/ci/triage-nightly-regression.mjs
      - name: Archive nightly report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-stress-report
          path: |
            reports/nightly-stress-report.json
            reports/nightly-stress-report.md
          retention-days: 90
