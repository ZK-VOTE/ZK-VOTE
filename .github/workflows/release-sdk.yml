name: SDK Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
      - '@zkvote/sdk@[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read
  id-token: write

jobs:
  release-sdk:
    name: Build, Verify & Publish SDK with Provenance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: packages/sdk/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check version against circuit registry compatibility
        run: |
          npm run check:compatibility
          # Verify matrix against backend circuit registry service
          npx tsx ../../scripts/ci/verify-sdk-compatibility-matrix.mjs

      - name: Build SDK artifacts
        run: npm run build

      - name: Generate artifact checksum manifest
        run: npm run manifest:generate

      - name: Verify checksum manifest integrity
        run: npm run manifest:verify

      - name: Run unit & compatibility tests
        run: npm test

      - name: Publish to npm with Provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Upload release manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdk-release-manifest
          path: packages/sdk/manifests/
          retention-days: 90
