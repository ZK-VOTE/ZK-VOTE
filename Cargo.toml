[workspace]
members = [
    "contracts/zkvote-groth16",
    "contracts/zkvote-prover",
    "contracts/dao-registry",
    "contracts/membership-sbt",
    "contracts/membership-tree",
    "contracts/voting",
    "contracts/comments",
    "contracts/rewards",
    "contracts/bridge/soroban",
    "contracts/circuit-registry",
    "contracts/transcript-registry",
    "contracts/poc-bls12-381",
    "contracts/token",
    "contracts/vdf",
    "contracts/threshold-crypto",
    "tests/integration",
]
default-members = [
    # Production contracts only — poc-bls12-381 is intentionally excluded from
    # default-members to prevent it from being included in production builds.
    # It remains a workspace member for development/research purposes only.
    # See: SPIKE-044 / issue #725 — BLS12-381 PoC isolation from BN254 production paths.
    "contracts/zkvote-groth16",
    "contracts/dao-registry",
    "contracts/membership-sbt",
    "contracts/membership-tree",
    "contracts/voting",
    "contracts/comments",
    "contracts/bridge/soroban",
    "contracts/circuit-registry",
    "contracts/rewards",
]
resolver = "2"

[workspace.dependencies]
# Soroban SDK with BN254 + Poseidon support (Protocol 25+)
soroban-sdk = "25.3.0"
num-bigint = "0.4"

# #727 — REPRODUCIBLE BUILDS
# All flags below must stay identical to the values used inside
# contracts/Dockerfile.build. Any divergence between a developer's local
# build and the canonical container build will change WASM output and break
# the audit trail recorded in .deployed-contracts*. See SPIKE-047 / #727.
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true

# Dev-profile overrides: the Rust prover (zkvote-prover) and the ark-* crypto
# crates are the bottleneck for witness/proof generation. Compile them optimized
# even in dev so `target/debug/zkprove` is fast enough to run the e2e suite
# without a full (LTO) release build of wasmtime. wasmtime itself stays at the
# default dev opt-level (already compiled) and is NOT rebuilt.
[profile.dev.package.ark-bls12-381]
opt-level = 3
[profile.dev.package.ark-bn254]
opt-level = 3
[profile.dev.package.ark-ec]
opt-level = 3
[profile.dev.package.ark-ff]
opt-level = 3
[profile.dev.package.ark-ff-asm]
opt-level = 3
[profile.dev.package.ark-ff-macros]
opt-level = 3
[profile.dev.package.ark-poly]
opt-level = 3
[profile.dev.package.ark-serialize]
opt-level = 3
[profile.dev.package.ark-serialize-derive]
opt-level = 3
[profile.dev.package.ark-std]
opt-level = 3
[profile.dev.package.num-bigint]
opt-level = 3
[profile.dev.package.num-traits]
opt-level = 3
[profile.dev.package.zkvote-prover]
opt-level = 3
