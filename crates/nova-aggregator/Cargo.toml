[package]
name = "nova-aggregator"
version = "0.1.0"
edition = "2021"
description = "Nova IVC Recursive Proof Aggregator for ZK-VOTE"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
clap = { version = "4.4", features = ["derive"] }

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"

[[bench]]
name = "nova_benchmark"
harness = false

