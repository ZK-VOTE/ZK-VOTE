services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_RELAYER_URL: https://server.zkvote.net
    ports:
      - "127.0.0.1:8081:8080"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    ports:
      - "127.0.0.1:3002:8080"
    env_file:
      - ./backend/.env.production
    volumes:
      - backend-data:/app/data
    restart: unless-stopped
    networks: [observability]

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/zkvote-alerts.yml:/etc/prometheus/zkvote-alerts.yml:ro
      - ./monitoring/prometheus/priority-queue-alerts.yml:/etc/prometheus/priority-queue-alerts.yml:ro
    depends_on: [backend]
    networks: [observability]

  prover:
    build:
      context: ./backend
    profiles: ["cpu"]
    environment:
      - PROVER_MODE=worker
      - PROVER_CONCURRENCY=4
      - PROVER_QUEUE_LIMIT=100
      - PROVER_TIMEOUT_MS=60000
    depends_on:
      backend:
        condition: service_healthy
    networks: [observability]
    restart: unless-stopped

  prover-gpu:
    build:
      context: ./backend
    profiles: ["gpu"]
    environment:
      - PROVER_MODE=worker
      - PROVER_ACCELERATION=cuda
      - PROVER_CONCURRENCY=8
      - PROVER_QUEUE_LIMIT=200
      - PROVER_TIMEOUT_MS=30000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      backend:
        condition: service_healthy
    networks: [observability]
    restart: unless-stopped

networks:
  observability:
    driver: bridge

volumes:
  backend-data:
