groups:
  - name: zkvote-relayer
    rules:
      - alert: ZKVoteRelayerHighErrorRate
        expr: |
          rate(http_requests_total{job="zkvote-relayer",status=~"5.."}[5m])
            / rate(http_requests_total{job="zkvote-relayer"}[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
          service: zkvote-relayer
        annotations:
          summary: "High error rate on ZK-VOTE relayer ({{ $value | humanizePercentage }})"
          description: "More than 5% of relayer requests are returning 5xx errors over the last 5 minutes."
          runbook_url: "https://github.com/ZK-VOTE/ZK-VOTE/blob/main/docs/ops/runbooks/panic-plus-surge.md"

      - alert: ZKVoteRelayerHighLatency
        expr: |
          histogram_quantile(0.95,
            rate(http_request_duration_seconds_bucket{job="zkvote-relayer"}[5m])
          ) > 2
        for: 5m
        labels:
          severity: warning
          service: zkvote-relayer
        annotations:
          summary: "High p95 latency on ZK-VOTE relayer ({{ $value | humanizeDuration }})"
          description: "95th percentile request latency exceeds 2 s over the last 5 minutes."
          runbook_url: "https://github.com/ZK-VOTE/ZK-VOTE/blob/main/docs/ops/runbooks/rotation-under-congestion.md"

      - alert: ZKVoteRelayerIndexerStalled
        expr: |
          time() - zkvote_relayer_last_indexed_block_timestamp > 120
        for: 3m
        labels:
          severity: critical
          service: zkvote-relayer
        annotations:
          summary: "ZK-VOTE relayer indexer has stalled"
          description: "No new block has been indexed for more than 2 minutes. Chain sync may have dropped."
          runbook_url: "https://github.com/ZK-VOTE/ZK-VOTE/blob/main/docs/ops/runbooks/panic-plus-surge.md"

      - alert: ZKVoteRelayerDatabaseUnavailable
        expr: |
          zkvote_relayer_db_up == 0
        for: 1m
        labels:
          severity: critical
          service: zkvote-relayer
        annotations:
          summary: "ZK-VOTE relayer cannot reach its database"
          description: "Database health check has been failing for more than 1 minute."
          runbook_url: "https://github.com/ZK-VOTE/ZK-VOTE/blob/main/docs/ops/runbooks/panic-plus-surge.md"

      - alert: ZKVoteRelayerHighUnauthenticatedRejections
        expr: |
          rate(zkvote_relayer_auth_rejections_total[5m]) > 0.5
        for: 2m
        labels:
          severity: warning
          service: zkvote-relayer
        annotations:
          summary: "Elevated unauthenticated request rejections on ZK-VOTE relayer"
          description: "More than 0.5 auth rejections per second over 5 minutes. May indicate a brute-force attempt."
          runbook_url: "https://github.com/ZK-VOTE/ZK-VOTE/blob/main/docs/ops/runbooks/panic-plus-surge.md"

      - alert: ZKVoteRelayerCrossTenantViolation
        expr: |
          increase(zkvote_relayer_cross_tenant_violations_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
          service: zkvote-relayer
        annotations:
          summary: "Cross-tenant data access violation detected on ZK-VOTE relayer"
          description: "A request accessed data belonging to another tenant. Immediate investigation required."
          runbook_url: "https://github.com/ZK-VOTE/ZK-VOTE/blob/main/docs/ops/runbooks/panic-plus-surge.md"

      - alert: ZKVoteRelayerReconciliationMismatch
        expr: |
          zkvote_relayer_reconciliation_mismatch_count > 0
        for: 5m
        labels:
          severity: critical
          service: zkvote-relayer
        annotations:
          summary: "ZK-VOTE relayer tally reconciliation mismatch"
          description: "On-chain vote tally does not match the relayer's local count. Data integrity issue."
          runbook_url: "https://github.com/ZK-VOTE/ZK-VOTE/blob/main/docs/ops/runbooks/panic-plus-surge.md"

      - alert: ZKVoteRelayerDaoTallyMismatch
        expr: |
          abs(zkvote_relayer_dao_tally_local - zkvote_relayer_dao_tally_onchain) > 0
        for: 5m
        labels:
          severity: critical
          service: zkvote-relayer
        annotations:
          summary: "ZK-VOTE DAO tally mismatch between local and on-chain state"
          description: "Local DAO tally diverges from on-chain tally. Governance integrity at risk."
          runbook_url: "https://github.com/ZK-VOTE/ZK-VOTE/blob/main/docs/ops/runbooks/panic-plus-surge.md"

      - alert: ZKVoteRelayerDaoReconciliationStale
        expr: |
          time() - zkvote_relayer_dao_last_reconciliation_timestamp > 3600
        for: 10m
        labels:
          severity: warning
          service: zkvote-relayer
        annotations:
          summary: "ZK-VOTE DAO reconciliation has not run in over 1 hour"
          description: "The last successful DAO reconciliation is more than 1 hour old. Stale governance state possible."
          runbook_url: "https://github.com/ZK-VOTE/ZK-VOTE/blob/main/docs/ops/runbooks/rotation-under-congestion.md"
